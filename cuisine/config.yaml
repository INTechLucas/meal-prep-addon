name: Cuisine (Claude)
version: "0.2.3"
slug: cuisine_claude
description: Repas, batch cooking, stock et liste de courses Lidl, pilotés par Claude via MCP
url: https://github.com/INTechLucas/meal-prep-addon
arch:
  - amd64
  - aarch64
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: Cuisine
panel_admin: false
boot: auto
homeassistant_api: true
ports:
  8767/tcp: 8767
ports_description:
  8767/tcp: Serveur MCP (HTTPS)
map:
  - type: ssl
    read_only: true
options:
  access_token: ""
  todo_entity: ""
  jour_courses: 4
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
schema:
  access_token: "password?"
  todo_entity: "str?"
  jour_courses: "int(0,6)"
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(debug|info|warning|error)
